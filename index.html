<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnhancedRNG</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/stylesheet.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
  </head>
  <body>
    <div class="gameScreen">
      <div class="container">
        <div>
          <div class="row">
            <div class="col-6">
              <div class="d-flex justify-content-center gap-3">
                <h2>Enter a Name:</h2>
                <input type="text" id="nameInput" />
                <button id="addBtn"><h3>Add Name</h3></button>
              </div>
            </div>
            <div class="col-6">
              <div class="d-flex flex-column justify-content-center">
                <div class="d-flex gap-3 justify-content-center">
                  <h2>Names per Group:</h2>
                  <h2 id="sliderNum"></h2>
                </div>
                <div class="d-flex gap-3 justify-content-center">
                  <input id="slider" type="range" min="1" max="6" step="1" value="2"/>
                  <button
                    id="genBtn"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasTop"
                    aria-controls="offcanvasTop"
                  >
                    <h3>Generate Groups</h3>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <h2 id="warningText">Please enter a new name above.</h2>
            <div class="d-flex justify-content-center gap-3">
              <h2>Total Names:</h2>
              <h2 id="totalNames"></h2>
            </div>
            <div class="col">
              <div id="nameBlock"></div>
            </div>
          </div>
        </div>
        <div>
          <h1>Random Name Generator</h1>
        </div>
      </div>
    </div>
    <!-- offcacnvas body -->
    <div
      class="offcanvas offcanvas-top"
      tabindex="-1"
      id="offcanvasTop"
      aria-labelledby="offcanvasTopLabel"
    >
      <div class="offcanvas-header">
        <h3 class="offcanvas-title" id="offcanvasTopLabel">
          Generation Complete...
        </h3>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body" id="randomBody"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
